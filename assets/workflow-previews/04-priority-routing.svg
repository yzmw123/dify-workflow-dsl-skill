<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d8dce5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c95a8"/>
    </marker>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #172033; }
      .muted { font-size: 13px; fill: #798296; }
      .node-title { font-size: 17px; font-weight: 700; fill: #20283a; }
      .node-type { font-size: 11px; font-weight: 700; letter-spacing: 0.7px; }
      .node-detail { font-size: 13px; fill: #687185; }
      .edge-label { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#f7f8fb"/>
  <rect width="1600" height="900" rx="24" fill="url(#dots)"/>
  <rect width="1600" height="76" rx="24" fill="#ffffff"/>
  <rect y="52" width="1600" height="24" fill="#ffffff"/>
  <line x1="0" y1="76" x2="1600" y2="76" stroke="#e6e8ee"/>

  <g class="ui">
    <rect x="26" y="20" width="38" height="38" rx="11" fill="#fce7f3"/>
    <text x="45" y="46" text-anchor="middle" font-size="20">🔀</text>
    <text class="title" x="78" y="44">Priority Routing / 工单优先级分流</text>
    <rect x="1115" y="23" width="122" height="31" rx="15.5" fill="#eef2ff"/>
    <text x="1176" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#4f46e5">WORKFLOW</text>
    <rect x="1250" y="23" width="118" height="31" rx="15.5" fill="#ecfdf5"/>
    <text x="1309" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">DSL 0.7.0</text>
    <rect x="1381" y="23" width="193" height="31" rx="15.5" fill="#fff7ed"/>
    <text x="1477" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">DIFY 1.16 EXAMPLE</text>

    <!-- edges -->
    <g fill="none" stroke="#8c95a8" stroke-width="3" marker-end="url(#arrow)">
      <path d="M290 425 C318 425 332 425 360 425"/>
      <path d="M580 402 C630 402 633 300 690 300"/>
      <path d="M580 448 C630 448 633 560 690 560"/>
      <path d="M930 300 C990 300 974 404 1030 404"/>
      <path d="M930 560 C990 560 974 446 1030 446"/>
      <path d="M1260 425 C1284 425 1301 425 1325 425"/>
    </g>
    <rect x="610" y="324" width="52" height="24" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text class="edge-label" x="636" y="340" text-anchor="middle" fill="#c2410c">紧急</text>
    <rect x="610" y="510" width="52" height="24" rx="12" fill="#f1f5f9" stroke="#dce1e9"/>
    <text class="edge-label" x="636" y="526" text-anchor="middle" fill="#64748b">默认</text>

    <!-- start -->
    <g filter="url(#shadow)">
      <rect x="70" y="350" width="220" height="150" rx="16" fill="#ffffff" stroke="#dfe3eb"/>
      <rect x="70" y="350" width="6" height="150" rx="3" fill="#6366f1"/>
    </g>
    <rect x="92" y="372" width="64" height="23" rx="7" fill="#eef2ff"/>
    <text class="node-type" x="124" y="388" text-anchor="middle" fill="#4f46e5">START</text>
    <text class="node-title" x="92" y="426">提交工单</text>
    <text class="node-detail" x="92" y="454">priority · select</text>
    <text class="node-detail" x="92" y="477">issue · paragraph</text>
    <circle cx="290" cy="425" r="6" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>

    <!-- if else -->
    <g filter="url(#shadow)">
      <rect x="360" y="350" width="220" height="150" rx="16" fill="#ffffff" stroke="#dfe3eb"/>
      <rect x="360" y="350" width="6" height="150" rx="3" fill="#f59e0b"/>
    </g>
    <rect x="382" y="372" width="76" height="23" rx="7" fill="#fff7ed"/>
    <text class="node-type" x="420" y="388" text-anchor="middle" fill="#c2410c">IF / ELSE</text>
    <text class="node-title" x="382" y="426">是否紧急</text>
    <text class="node-detail" x="382" y="454">priority is “紧急”</text>
    <circle cx="360" cy="425" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="580" cy="402" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="580" cy="448" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>

    <!-- urgent template -->
    <g filter="url(#shadow)">
      <rect x="690" y="230" width="240" height="140" rx="16" fill="#ffffff" stroke="#dfe3eb"/>
      <rect x="690" y="230" width="6" height="140" rx="3" fill="#14b8a6"/>
    </g>
    <rect x="712" y="252" width="128" height="23" rx="7" fill="#ecfdf5"/>
    <text class="node-type" x="776" y="268" text-anchor="middle" fill="#047857">TEMPLATE TRANSFORM</text>
    <text class="node-title" x="712" y="306">生成升级通知</text>
    <text class="node-detail" x="712" y="336">issue → Markdown</text>
    <circle cx="690" cy="300" r="6" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="930" cy="300" r="6" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>

    <!-- normal template -->
    <g filter="url(#shadow)">
      <rect x="690" y="490" width="240" height="140" rx="16" fill="#ffffff" stroke="#dfe3eb"/>
      <rect x="690" y="490" width="6" height="140" rx="3" fill="#14b8a6"/>
    </g>
    <rect x="712" y="512" width="128" height="23" rx="7" fill="#ecfdf5"/>
    <text class="node-type" x="776" y="528" text-anchor="middle" fill="#047857">TEMPLATE TRANSFORM</text>
    <text class="node-title" x="712" y="566">生成普通通知</text>
    <text class="node-detail" x="712" y="596">issue → Markdown</text>
    <circle cx="690" cy="560" r="6" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="930" cy="560" r="6" fill="#ffffff" stroke="#14b8a6" stroke-width="3"/>

    <!-- aggregator -->
    <g filter="url(#shadow)">
      <rect x="1030" y="350" width="230" height="150" rx="16" fill="#ffffff" stroke="#dfe3eb"/>
      <rect x="1030" y="350" width="6" height="150" rx="3" fill="#a855f7"/>
    </g>
    <rect x="1052" y="372" width="138" height="23" rx="7" fill="#faf5ff"/>
    <text class="node-type" x="1121" y="388" text-anchor="middle" fill="#7e22ce">VARIABLE AGGREGATOR</text>
    <text class="node-title" x="1052" y="426">合并分支结果</text>
    <text class="node-detail" x="1052" y="454">output · string</text>
    <circle cx="1030" cy="425" r="6" fill="#ffffff" stroke="#a855f7" stroke-width="3"/>
    <circle cx="1260" cy="425" r="6" fill="#ffffff" stroke="#a855f7" stroke-width="3"/>

    <!-- end -->
    <g filter="url(#shadow)">
      <rect x="1325" y="350" width="215" height="150" rx="16" fill="#ffffff" stroke="#dfe3eb"/>
      <rect x="1325" y="350" width="6" height="150" rx="3" fill="#64748b"/>
    </g>
    <rect x="1347" y="372" width="50" height="23" rx="7" fill="#f1f5f9"/>
    <text class="node-type" x="1372" y="388" text-anchor="middle" fill="#475569">END</text>
    <text class="node-title" x="1347" y="426">返回处理结果</text>
    <text class="node-detail" x="1347" y="454">routing_result</text>
    <circle cx="1325" cy="425" r="6" fill="#ffffff" stroke="#64748b" stroke-width="3"/>

    <rect x="26" y="842" width="460" height="34" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#e3e6ed"/>
    <text class="muted" x="43" y="864">Rendered from examples/dify-1.16.0/04-priority-routing.yml · 6 nodes</text>
  </g>
</svg>
