version: "0.7.0"
kind: app
app:
  name: "Excel 数据分析"
  description: "读取 Excel 表格，将内容规范化为 Markdown 后交给大模型分析"
  icon: "📊"
  icon_type: emoji
  icon_background: "#E4FBCC"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.6@e2665624a156f52160927bceac9e169bd7e5ae6b936ae82575e14c90af390e6e
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: excel_start
        type: custom
        data:
          type: start
          title: "上传表格"
          variables:
            - label: "Excel 文件"
              variable: spreadsheet
              type: file
              required: true
            - label: "分析目标"
              variable: analysis_goal
              type: paragraph
              required: true
              max_length: 2000
        position: {x: 40, y: 260}
        positionAbsolute: {x: 40, y: 260}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 120
      - id: extract_sheet
        type: custom
        data:
          type: document-extractor
          title: "读取 Excel"
          variable_selector: [excel_start, spreadsheet]
        position: {x: 350, y: 260}
        positionAbsolute: {x: 350, y: 260}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 70
      - id: to_markdown
        type: custom
        data:
          type: code
          title: "转换为 Markdown"
          code_language: python3
          code: |
            def main(text: str) -> dict:
                lines = [line.strip() for line in text.splitlines() if line.strip()]
                if not lines:
                    return {"markdown": "_表格中没有可分析的数据。_"}

                rows = []
                for line in lines:
                    if "\t" in line:
                        cells = [cell.strip() for cell in line.split("\t")]
                    elif "," in line:
                        cells = [cell.strip() for cell in line.split(",")]
                    else:
                        cells = [line]
                    rows.append(cells)

                width = max(len(row) for row in rows)
                rows = [row + [""] * (width - len(row)) for row in rows]
                header = rows[0]
                body = rows[1:]
                output = [
                    "| " + " | ".join(header) + " |",
                    "| " + " | ".join(["---"] * width) + " |",
                ]
                output.extend("| " + " | ".join(row) + " |" for row in body)
                return {"markdown": "\n".join(output)}
          variables:
            - variable: text
              value_selector: [extract_sheet, text]
          outputs:
            markdown:
              type: string
              children: null
        position: {x: 660, y: 260}
        positionAbsolute: {x: 660, y: 260}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 100
      - id: analyze_sheet
        type: custom
        data:
          type: llm
          title: "分析数据"
          model:
            provider: langgenius/openai/openai
            name: gpt-4.1-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: excel-system
              role: system
              text: "你是数据分析师。只依据给定表格，明确区分事实、推断和数据限制。"
            - id: excel-user
              role: user
              text: "分析目标：{{#excel_start.analysis_goal#}}\n\n表格（Markdown）：\n{{#to_markdown.markdown#}}\n\n请给出关键发现、异常、趋势和建议。"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position: {x: 970, y: 260}
        positionAbsolute: {x: 970, y: 260}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
      - id: excel_end
        type: custom
        data:
          type: end
          title: "输出报告"
          outputs:
            - variable: markdown_table
              value_selector: [to_markdown, markdown]
              value_type: string
            - variable: analysis
              value_selector: [analyze_sheet, text]
              value_type: string
        position: {x: 1280, y: 260}
        positionAbsolute: {x: 1280, y: 260}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
    edges:
      - id: excel_start-source-extract_sheet-target
        source: excel_start
        sourceHandle: source
        target: extract_sheet
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: document-extractor, isInIteration: false, isInLoop: false}
      - id: extract_sheet-source-to_markdown-target
        source: extract_sheet
        sourceHandle: source
        target: to_markdown
        targetHandle: target
        type: custom
        data: {sourceType: document-extractor, targetType: code, isInIteration: false, isInLoop: false}
      - id: to_markdown-source-analyze_sheet-target
        source: to_markdown
        sourceHandle: source
        target: analyze_sheet
        targetHandle: target
        type: custom
        data: {sourceType: code, targetType: llm, isInIteration: false, isInLoop: false}
      - id: analyze_sheet-source-excel_end-target
        source: analyze_sheet
        sourceHandle: source
        target: excel_end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.72}
