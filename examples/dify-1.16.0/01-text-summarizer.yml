version: "0.7.0"
kind: app
app:
  name: "文本摘要器"
  description: "将长文本整理为结构化摘要"
  icon: "📝"
  icon_type: emoji
  icon_background: "#E4FBCC"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.6@e2665624a156f52160927bceac9e169bd7e5ae6b936ae82575e14c90af390e6e
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: "输入文本"
          variables:
            - label: "待摘要文本"
              variable: source_text
              type: paragraph
              required: true
              max_length: 50000
        position: {x: 40, y: 240}
        positionAbsolute: {x: 40, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: summarize
        type: custom
        data:
          type: llm
          title: "生成摘要"
          model:
            provider: langgenius/openai/openai
            name: gpt-4.1-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: summary-system
              role: system
              text: "你是严谨的摘要助手。保留事实、数字和结论，不补充原文没有的信息。"
            - id: summary-user
              role: user
              text: "请输出包含要点、数据和行动项的 Markdown 摘要：\n\n{{#start.source_text#}}"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position: {x: 360, y: 240}
        positionAbsolute: {x: 360, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 98
      - id: end
        type: custom
        data:
          type: end
          title: "输出摘要"
          outputs:
            - variable: summary
              value_selector: [summarize, text]
              value_type: string
        position: {x: 680, y: 240}
        positionAbsolute: {x: 680, y: 240}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: start-source-summarize-target
        source: start
        sourceHandle: source
        target: summarize
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
      - id: summarize-source-end-target
        source: summarize
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.8}
