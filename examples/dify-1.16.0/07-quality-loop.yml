version: "0.7.0"
kind: app
app:
  name: "质量门槛循环"
  description: "在 Loop 中累计检查次数，达到阈值后输出结果"
  icon: "🔄"
  icon_type: emoji
  icon_background: "#EDE9FE"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: loop_input
        type: custom
        data:
          type: start
          title: "开始"
          variables: []
        position: {x: 40, y: 280}
        positionAbsolute: {x: 40, y: 280}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 54
      - id: quality_loop
        type: custom
        data:
          type: loop
          title: "质量检查循环"
          loop_count: 5
          logical_operator: and
          loop_variables:
            - id: review-count
              label: review_count
              value: "0"
              value_type: constant
              var_type: number
          break_conditions:
            - id: enough-reviews
              variable_selector: [quality_loop, review_count]
              comparison_operator: "≥"
              value: "3"
              varType: number
          start_node_id: quality_loop_start
          width: 520
          height: 210
        position: {x: 350, y: 250}
        positionAbsolute: {x: 350, y: 250}
        sourcePosition: right
        targetPosition: left
        width: 520
        height: 210
        zIndex: 1
      - id: quality_loop_start
        parentId: quality_loop
        type: custom-loop-start
        draggable: false
        selectable: false
        data:
          type: loop-start
          title: ""
          isInLoop: true
        position: {x: 60, y: 80}
        positionAbsolute: {x: 410, y: 330}
        sourcePosition: right
        targetPosition: left
        width: 44
        height: 48
        zIndex: 1002
      - id: increase_count
        parentId: quality_loop
        type: custom
        data:
          type: assigner
          title: "增加检查次数"
          version: "2"
          isInIteration: false
          isInLoop: true
          loop_id: quality_loop
          items:
            - variable_selector: [quality_loop, review_count]
              input_type: constant
              operation: "+="
              value: 1
              write_mode: over-write
        position: {x: 190, y: 62}
        positionAbsolute: {x: 540, y: 312}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 86
        zIndex: 1002
      - id: loop_end
        type: custom
        data:
          type: end
          title: "输出检查次数"
          outputs:
            - variable: review_count
              value_selector: [quality_loop, review_count]
              value_type: number
        position: {x: 940, y: 280}
        positionAbsolute: {x: 940, y: 280}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: loop_input-source-quality_loop-target
        source: loop_input
        sourceHandle: source
        target: quality_loop
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: loop, isInIteration: false, isInLoop: false}
      - id: quality_loop_start-source-increase_count-target
        source: quality_loop_start
        sourceHandle: source
        target: increase_count
        targetHandle: target
        type: custom
        zIndex: 1002
        data:
          sourceType: loop-start
          targetType: assigner
          isInIteration: false
          isInLoop: true
          loop_id: quality_loop
      - id: quality_loop-source-loop_end-target
        source: quality_loop
        sourceHandle: source
        target: loop_end
        targetHandle: target
        type: custom
        data: {sourceType: loop, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.75}
