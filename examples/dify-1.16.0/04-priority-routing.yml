version: "0.7.0"
kind: app
app:
  name: "工单优先级分流"
  description: "根据工单优先级执行不同处理策略并合并结果"
  icon: "🔀"
  icon_type: emoji
  icon_background: "#FCE7F3"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: route_start
        type: custom
        data:
          type: start
          title: "提交工单"
          variables:
            - label: "优先级"
              variable: priority
              type: select
              required: true
              options: [紧急, 普通]
            - label: "问题描述"
              variable: issue
              type: paragraph
              required: true
              max_length: 5000
        position: {x: 40, y: 280}
        positionAbsolute: {x: 40, y: 280}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 120
      - id: priority_gate
        type: custom
        data:
          type: if-else
          title: "是否紧急"
          cases:
            - id: urgent
              case_id: urgent
              logical_operator: and
              conditions:
                - id: priority-is-urgent
                  variable_selector: [route_start, priority]
                  comparison_operator: is
                  value: "紧急"
                  varType: string
        position: {x: 350, y: 280}
        positionAbsolute: {x: 350, y: 280}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 126
      - id: urgent_message
        type: custom
        data:
          type: template-transform
          title: "生成升级通知"
          variables:
            - variable: issue
              value_selector: [route_start, issue]
          template: "## 紧急工单\n\n请立即升级处理：{{ issue }}"
        position: {x: 680, y: 160}
        positionAbsolute: {x: 680, y: 160}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 80
      - id: normal_message
        type: custom
        data:
          type: template-transform
          title: "生成普通通知"
          variables:
            - variable: issue
              value_selector: [route_start, issue]
          template: "## 普通工单\n\n已进入标准处理队列：{{ issue }}"
        position: {x: 680, y: 400}
        positionAbsolute: {x: 680, y: 400}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 80
      - id: route_merge
        type: custom
        data:
          type: variable-aggregator
          title: "合并分支结果"
          output_type: string
          variables:
            - [urgent_message, output]
            - [normal_message, output]
        position: {x: 1000, y: 280}
        positionAbsolute: {x: 1000, y: 280}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 80
      - id: route_end
        type: custom
        data:
          type: end
          title: "返回处理结果"
          outputs:
            - variable: routing_result
              value_selector: [route_merge, output]
              value_type: string
        position: {x: 1320, y: 280}
        positionAbsolute: {x: 1320, y: 280}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: route_start-source-priority_gate-target
        source: route_start
        sourceHandle: source
        target: priority_gate
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: if-else, isInIteration: false, isInLoop: false}
      - id: priority_gate-urgent-urgent_message-target
        source: priority_gate
        sourceHandle: urgent
        target: urgent_message
        targetHandle: target
        type: custom
        data: {sourceType: if-else, targetType: template-transform, isInIteration: false, isInLoop: false}
      - id: priority_gate-false-normal_message-target
        source: priority_gate
        sourceHandle: "false"
        target: normal_message
        targetHandle: target
        type: custom
        data: {sourceType: if-else, targetType: template-transform, isInIteration: false, isInLoop: false}
      - id: urgent_message-source-route_merge-target
        source: urgent_message
        sourceHandle: source
        target: route_merge
        targetHandle: target
        type: custom
        data: {sourceType: template-transform, targetType: variable-aggregator, isInIteration: false, isInLoop: false}
      - id: normal_message-source-route_merge-target
        source: normal_message
        sourceHandle: source
        target: route_merge
        targetHandle: target
        type: custom
        data: {sourceType: template-transform, targetType: variable-aggregator, isInIteration: false, isInLoop: false}
      - id: route_merge-source-route_end-target
        source: route_merge
        sourceHandle: source
        target: route_end
        targetHandle: target
        type: custom
        data: {sourceType: variable-aggregator, targetType: end, isInIteration: false, isInLoop: false}
    viewport: {x: 0, y: 0, zoom: 0.72}
