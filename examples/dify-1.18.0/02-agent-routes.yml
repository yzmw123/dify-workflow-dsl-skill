version: "0.7.0"
kind: app
app:
  name: Dify 1.18 Agent output routes
  description: 在 Workflow 中使用可移植 Agent v2 节点生成研究报告
  icon: 🔬
  icon_type: emoji
  icon_background: '#E0E7FF'
  mode: workflow
  use_icon_as_answer_icon: false
agent_packages:
  researcher:
    schema_version: 1
    metadata:
      name: 研究 Agent
      description: 根据工作流任务生成结构化研究报告
      role: researcher
      icon_type: emoji
      icon: 🔬
      icon_background: '#E0E7FF'
    soul:
      schema_version: 1
      prompt:
        system_prompt: 你是严谨的研究员。明确证据、推断和未知项，不虚构来源。
      model:
        plugin_id: langgenius/openai
        model_provider: langgenius/openai/openai
        model: gpt-4.1-mini
        credential_ref: null
        model_settings:
          temperature: 0.2
    omitted_assets: []
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.2.6@e2665624a156f52160927bceac9e169bd7e5ae6b936ae82575e14c90af390e6e
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: agent_start
      type: custom
      data:
        type: start
        title: 输入研究任务
        variables:
        - label: 研究任务
          variable: task
          type: paragraph
          required: true
          max_length: 10000
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    - id: research_agent
      type: custom
      data:
        type: agent
        title: 研究 Agent
        version: '2'
        agent_node_kind: dify_agent
        agent_binding:
          binding_type: inline_agent
          package_ref: researcher
        agent_job:
          schema_version: 1
          mode: tell_agent_what_to_do
          workflow_prompt: 完成研究任务，输出带有结论、依据、风险和下一步的报告。
          previous_node_output_refs:
          - selector:
            - agent_start
            - task
          declared_outputs:
          - name: summary
            type: string
            required: true
          human_contacts: []
          metadata: {}
          output_routes:
            enabled: true
            routes:
            - id: resolve
              name: The request can be answered directly.
              label: Resolve
            - id: escalate
              name: The request needs specialist review.
              label: Escalate
        agent_task: 完成研究任务，输出带有结论、依据、风险和下一步的报告。
        agent_output_routes:
          enabled: true
          routes:
          - id: resolve
            name: The request can be answered directly.
            label: Resolve
          - id: escalate
            name: The request needs specialist review.
            label: Escalate
      position:
        x: 370
        y: 260
      positionAbsolute:
        x: 370
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 180
    - id: resolve_end
      type: custom
      data:
        type: end
        title: Resolve
        outputs:
        - variable: route
          value_type: string
          value_selector:
          - research_agent
          - switch
        - variable: text
          value_type: string
          value_selector:
          - research_agent
          - text
        - variable: summary
          value_type: string
          value_selector:
          - research_agent
          - summary
      position:
        x: 1000
        y: 100
      positionAbsolute:
        x: 710
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    - id: escalate_end
      type: custom
      data:
        type: end
        title: Escalate
        outputs:
        - variable: route
          value_type: string
          value_selector:
          - research_agent
          - switch
        - variable: text
          value_type: string
          value_selector:
          - research_agent
          - text
        - variable: summary
          value_type: string
          value_selector:
          - research_agent
          - summary
      position:
        x: 1000
        y: 400
      positionAbsolute:
        x: 710
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    edges:
    - id: agent_start-source-research_agent-target
      source: agent_start
      sourceHandle: source
      target: research_agent
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: agent
        isInIteration: false
        isInLoop: false
    - id: research_agent-resolve
      type: custom
      source: research_agent
      sourceHandle: resolve
      target: resolve_end
      targetHandle: target
      data:
        sourceType: agent
        targetType: end
    - id: research_agent-escalate
      type: custom
      source: research_agent
      sourceHandle: escalate
      target: escalate_end
      targetHandle: target
      data:
        sourceType: agent
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 0.8
