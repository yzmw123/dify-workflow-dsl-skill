app:
  description: Retrieve cited evidence from a KnowledgeFS space.
  icon: 📗
  icon_background: '#E4E7FF'
  mode: workflow
  name: Dify 1.18 Knowledge Retrieval v2
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: "0.7.0"
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
    - data:
        sourceType: start
        targetType: knowledge-retrieval-v2
      id: start-source-retrieval-target
      source: start
      sourceHandle: source
      target: retrieval-v2
      targetHandle: target
      type: custom
    - data:
        sourceType: knowledge-retrieval-v2
        targetType: end
      id: retrieval-source-end-target
      source: retrieval-v2
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        title: Start
        type: start
        variables:
        - label: query
          required: true
          type: text-input
          variable: query
      id: start
      type: custom
    - data:
        control_space_ids:
        - 00000000-0000-4000-8000-000000000001
        desc: ''
        query_variable_selector:
        - start
        - query
        title: Knowledge Retrieval v2
        top_n: 5
        type: knowledge-retrieval-v2
        mode: fast
      id: retrieval-v2
      type: custom
    - data:
        desc: ''
        outputs:
        - value_selector:
          - retrieval-v2
          - result
          value_type: array[object]
          variable: evidence
        title: End
        type: end
      id: end
      type: custom
    viewport:
      x: 0
      y: 0
      zoom: 1
