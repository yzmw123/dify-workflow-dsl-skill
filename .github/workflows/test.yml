name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate DSL 0.7 examples strictly
        run: python scripts/validate_dsl.py --strict --target-version 0.7.0 tests/fixtures/valid/*.yml
      - name: Validate DSL 0.6 examples strictly
        run: python scripts/validate_dsl.py --strict --target-version 0.6.0 tests/fixtures/valid-0.6/*.yml
