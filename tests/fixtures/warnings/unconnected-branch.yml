version: "0.7.0"
kind: app
app: {name: Unconnected Branch, mode: workflow}
dependencies: []
workflow:
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: Start
          variables:
            - {label: Value, variable: value, type: paragraph, required: true}
      - id: branch
        type: custom
        data:
          type: if-else
          title: Branch
          cases:
            - id: "true"
              case_id: "true"
              logical_operator: and
              conditions:
                - {variable_selector: [start, value], comparison_operator: is, value: yes, varType: string}
      - {id: "yes", type: custom, data: {type: end, title: Yes, outputs: []}}
    edges:
      - {id: start-branch, source: start, target: branch, sourceHandle: source, targetHandle: target, data: {sourceType: start, targetType: if-else}}
      - {id: branch-yes, source: branch, target: "yes", sourceHandle: "true", targetHandle: target, data: {sourceType: if-else, targetType: end}}
