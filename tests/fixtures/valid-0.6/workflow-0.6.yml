version: "0.6.0"
kind: app
app:
  name: Translate
  mode: workflow
  icon: "🌐"
  icon_type: emoji
  icon_background: "#E4FBCC"
  description: "Translate input text."
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/tongyi:0.1.36@test
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: Start
          variables:
            - label: Input
              variable: input_text
              type: paragraph
              required: true
              max_length: 4096
      - id: llm
        type: custom
        data:
          type: llm
          title: Translate
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-plus
            mode: chat
            completion_params: {}
          prompt_template:
            - role: user
              text: "Translate: {{#start.input_text#}}"
      - id: end
        type: custom
        data:
          type: end
          title: End
          outputs:
            - variable: result
              value_selector: [llm, text]
    edges:
      - id: start-source-llm-target
        source: start
        target: llm
        sourceHandle: source
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm}
      - id: llm-source-end-target
        source: llm
        target: end
        sourceHandle: source
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end}
