version: "0.7.0"
kind: app
app: {name: Branch, mode: workflow}
dependencies: []
workflow:
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: Start
          variables: [{label: Value, variable: value, type: text-input, required: true}]
      - id: branch
        type: custom
        data:
          type: if-else
          title: Branch
          cases:
            - id: true
              case_id: true
              logical_operator: and
              conditions: [{variable_selector: [start, value], comparison_operator: is, value: yes, varType: string}]
      - {id: yes_end, type: custom, data: {type: end, title: Yes, outputs: []}}
      - {id: no_end, type: custom, data: {type: end, title: No, outputs: []}}
    edges:
      - {id: start-source-branch-target, source: start, target: branch, sourceHandle: source, targetHandle: target, data: {sourceType: start, targetType: if-else}}
      - {id: branch-source-yes-target, source: branch, target: yes_end, sourceHandle: source, targetHandle: target, data: {sourceType: if-else, targetType: end}}
      - {id: branch-false-no-target, source: branch, target: no_end, sourceHandle: false, targetHandle: target, data: {sourceType: if-else, targetType: end}}
