version: "0.7.0"
kind: app
app: {name: Missing LLM Context, mode: workflow}
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.6@test
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  graph:
    nodes:
      - id: start
        type: custom
        data: {type: start, title: Start, variables: []}
      - id: llm
        type: custom
        data:
          type: llm
          title: LLM
          model:
            provider: langgenius/openai/openai
            name: gpt-4.1-mini
            mode: chat
            completion_params: {}
          prompt_template:
            - {role: user, text: "Hello"}
      - id: end
        type: custom
        data:
          type: end
          title: End
          outputs:
            - {variable: result, value_selector: [llm, text]}
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm}
      - id: llm-source-end-target
        source: llm
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end}
